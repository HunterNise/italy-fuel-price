name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q station_map analysis/scripts tools tests

      - name: Check station-map version command
        run: python station_map/serve_map.py --version

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
