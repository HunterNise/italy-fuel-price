name: Deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Europe/Rome"
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Run repository checks
        run: |
          python -m compileall -q station_map analysis/scripts tools tests
          python station_map/serve_map.py --version
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Download one source snapshot bundle
        run: |
          python tools/fetch_web_sources.py \
            --output _build/sources

      - name: Restore previous rolling history state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/restore_history_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --output _build/history-state.previous.json \
            --allow-missing

      - name: Build validated static data
        shell: bash
        run: |
          history_args=()
          if [[ -f _build/history-state.previous.json ]]; then
            history_args+=(--history-state _build/history-state.previous.json)
          fi

          python tools/build_web_data.py \
            --output _build/data \
            --registry-file _build/sources/anagrafica_impianti_attivi.csv \
            --price-file _build/sources/prezzo_alle_8.csv \
            --localities-file _build/sources/LocalitaPuntuali_21.zip \
            --municipalities-2021-file _build/sources/Limiti2021_g.zip \
            "${history_args[@]}" \
            --history-state-output _build/history-state.json

      - name: Check static/local parity
        run: |
          python tools/check_static_parity.py \
            --registry-file _build/sources/anagrafica_impianti_attivi.csv \
            --price-file _build/sources/prezzo_alle_8.csv \
            --data-dir _build/data

      - name: Assemble allowlisted Pages site
        run: |
          python tools/build_static_site.py \
            --data-dir _build/data \
            --output _site
          cat _site/.italy-fuel-pages-build

      - name: Persist rolling history state
        uses: actions/upload-artifact@v7
        with:
          name: pages-history-state
          path: _build/history-state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          overwrite: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
